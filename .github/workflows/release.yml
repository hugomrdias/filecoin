name: Release

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  CI: true
  FORCE_COLOR: 1
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # needs to be personal token so release PRs can run workflows
          token: ${{ secrets.GH_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
  npm:
    needs: release
    if: |
      contains(fromJson(needs.release.outputs.paths_released), 'packages/iso-filecoin') ||
      contains(fromJson(needs.release.outputs.paths_released), 'packages/iso-filecoin-react') ||
      contains(fromJson(needs.release.outputs.paths_released), 'packages/iso-filecoin-wallets')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run lint
      - run: pnpm run build
      - name: Publish iso-filecoin
        if: contains(fromJson(needs.release.outputs.paths_released), 'packages/iso-filecoin')
        working-directory: packages/iso-filecoin
        run: pnpm publish --access=public --no-git-checks --publish-wait-timeout 600000
      - name: Publish iso-filecoin-wallets
        if: contains(fromJson(needs.release.outputs.paths_released), 'packages/iso-filecoin-wallets')
        working-directory: packages/iso-filecoin-wallets
        run: pnpm publish --access=public --no-git-checks --publish-wait-timeout 600000
      - name: Publish iso-filecoin-react
        if: contains(fromJson(needs.release.outputs.paths_released), 'packages/iso-filecoin-react')
        working-directory: packages/iso-filecoin-react
        run: pnpm publish --access=public --no-git-checks --publish-wait-timeout 600000
